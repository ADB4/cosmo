services:
  app:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - COSMO_DB_PATH=/app/chroma_db
      - COSMO_UPLOAD_DIR=/app/uploads
      - COSMO_DECK_DIR=/app/decks
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Opt into a stronger embedding model. Switching requires a fresh
      # collection + full re-ingest (see `python -m backend.cli reindex`) and a
      # re-tuned retrieval cutoff. Leave unset to keep the default
      # nomic-embed-text and the existing chroma_db.
      # - COSMO_EMBED_MODEL=qwen3-embedding:0.6b
      # Retrieval cutoff override (defaults to the active embedding profile).
      # - COSMO_RETRIEVAL_MAX_DISTANCE=0.42
    volumes:
      - ./chroma_db:/app/chroma_db
      - uploads:/app/uploads
      - ./decks:/app/decks
      - ./quizzes:/app/quizzes
    networks:
      - internal

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  uploads: